---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — Sri Vemuri</title>
<meta name="description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}">

<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta property="article:author" content="Sri Vemuri">
<meta name="twitter:card" content="summary">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

{% seo title=false %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "author": { "@type": "Person", "name": "Sri Vemuri" },
  "url": "{{ site.url }}{{ page.url }}"
}
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F4EFE6;
  --ink: #1C1208;
  --muted: #8a7a66;
  --accent: #B85530;
  --rule: rgba(28, 18, 8, 0.12);
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  font-size: clamp(1.1rem, 2.4vw, 1.25rem);
  line-height: 1.5;
  letter-spacing: 0.005em;
  padding: 3rem 2rem 6rem;
  min-height: 100vh;
}

@media (max-width: 520px) {
  body { padding: 2rem 1.5rem 4rem; }
}

.wrap {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.site-nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  text-transform: lowercase;
  transition: color 0.2s;
}
.site-nav a:hover { color: var(--accent); }

.post-header { margin-top: 1rem; }

.post-title {
  font-weight: 400;
  font-size: clamp(2.2rem, 6vw, 2.8rem);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin-bottom: 0.5rem;
}

.post-meta {
  display: block;
  font-size: 0.95rem;
  color: var(--muted);
  font-style: italic;
}

.post-content > * + * { margin-top: 1.1rem; }
.post-content h2 { font-weight: 500; font-size: 1.55rem; margin-top: 2.2rem !important; letter-spacing: -0.003em; }
.post-content h3 { font-weight: 500; font-size: 1.3rem; margin-top: 1.8rem !important; }
.post-content p { line-height: 1.55; }
.post-content a {
  color: var(--ink);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  text-decoration-color: var(--accent);
  transition: color 0.2s;
}
.post-content a:hover { color: var(--accent); }
.post-content ul, .post-content ol { padding-left: 1.4rem; }
.post-content li { line-height: 1.5; }
.post-content li + li { margin-top: 0.3rem; }
.post-content blockquote {
  border-left: 2px solid var(--accent);
  padding-left: 1.1rem;
  margin-left: 0;
  font-style: italic;
  color: #4a3a26;
}
.post-content img, .post-content figure {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 1.6rem 0;
}
.post-content figure img { margin: 0; }
.post-content figcaption {
  font-size: 0.9rem;
  color: var(--muted);
  font-style: italic;
  text-align: center;
  margin-top: 0.5rem;
}
.post-content code {
  font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  font-size: 0.88em;
  background: rgba(28, 18, 8, 0.06);
  padding: 0.1em 0.35em;
  border-radius: 3px;
}
.post-content pre {
  background: rgba(28, 18, 8, 0.06);
  padding: 1rem 1.1rem;
  overflow-x: auto;
  font-size: 0.92rem;
  line-height: 1.5;
}
.post-content pre code { background: none; padding: 0; }
.post-content hr { border: none; border-top: 1px solid var(--rule); margin: 2rem auto; width: 40%; }

.post-footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--rule);
  text-align: center;
}
.post-footer a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
}
.post-footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="wrap">

  <nav class="site-nav">
    <a href="/blog/">← all writing</a>
  </nav>

  <article>
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <time class="post-meta" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </header>

    <div class="post-content">
      {{ content }}
    </div>
  </article>

  <footer class="post-footer">
    <a href="/blog/">← all writing</a>
  </footer>

</div>

</body>
</html>
